<style>
  :root {
    --ink: #1c2b2a;
    --paper: #f7f9f8;
    --teal: #0f766e;
    --teal-dark: #0b5a54;
    --line: #d5dedc;
    --user: #dff1ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    display: grid;
    place-items: center;
  }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; padding: 24px; }
  .btn {
    font: inherit;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: 10px;
    border: 2px solid var(--teal);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .btn-primary { background: var(--teal); color: #fff; }
  .btn-primary:hover { background: var(--teal-dark); }
  .btn-secondary { background: transparent; color: var(--teal); }
  .btn-secondary:hover { background: var(--teal); color: #fff; }
  .btn:focus-visible, .chat button:focus-visible, .chat input:focus-visible {
    outline: 3px solid #f59e0b; outline-offset: 2px;
  }

  /* Chat bot panel */
  .chat {
    position: fixed; right: 20px; bottom: 20px;
    width: min(380px, calc(100vw - 40px));
    height: min(520px, calc(100vh - 40px));
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
    display: flex; flex-direction: column; overflow: hidden;
    transform: translateY(20px); opacity: 0; visibility: hidden;
    transition: transform .2s ease, opacity .2s ease, visibility .2s;
  }
  .chat.open { transform: none; opacity: 1; visibility: visible; }
  .chat header {
    background: var(--teal); color: #fff; padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .chat header strong { display: block; }
  .chat header small { opacity: .85; }
  .chat header button {
    background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; line-height: 1;
  }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 13px; border-radius: 12px; line-height: 1.4; font-size: 15px; }
  .msg.bot { background: #eef2f1; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: var(--user); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chat form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  .chat input {
    flex: 1; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  }
  .chat form button {
    font: inherit; font-weight: 600; background: var(--teal); color: #fff;
    border: 0; border-radius: 8px; padding: 0 16px; cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) { .chat { transition: none; } }
</style>
<script>
  const chat = document.getElementById('chat');
  const messages = document.getElementById('messages');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('chat-input');
  const topicLabel = document.getElementById('chat-topic');
  let currentTopic = null;

  function addMessage(text, who) {
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  }

  function openBot(topic) {
    // Reset the conversation if the person opened the bot from a different button
    if (topic !== currentTopic) {
      messages.innerHTML = '';
      currentTopic = topic;
      topicLabel.textContent = topic;
      addMessage('Hi! You\'re chatting with ' + topic + '. How can I help?', 'bot');
    }
    chat.classList.add('open');
    chat.setAttribute('aria-hidden', 'false');
    input.focus();
  }

  function closeBot() {
    chat.classList.remove('open');
    chat.setAttribute('aria-hidden', 'true');
  }

  // Both buttons use the same handler
  document.querySelectorAll('[data-open-bot]').forEach(btn => {
    btn.addEventListener('click', () => openBot(btn.dataset.topic));
  });
  document.getElementById('chat-close').addEventListener('click', closeBot);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBot(); });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    input.value = '';
    const reply = await getBotReply(text, currentTopic);
    addMessage(reply, 'bot');
  });

  // ===== CONNECT YOUR REAL BOT HERE =====
  // Replace this placeholder with a call to your backend / AI API.
  async function getBotReply(message, topic) {
    // Example:
    // const res = await fetch('/api/chat', {
    //   method: 'POST',
    //   headers: { 'Content-Type': 'application/json' },
    //   body: JSON.stringify({ message, topic })
    // });
    // const data = await res.json();
    // return data.reply;
    return 'You said: "' + message + '". Connect getBotReply() to your bot to get real answers.';
  }
</script>
