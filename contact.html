<style>
  :root {
    --ink: #1c2b2a;
    --teal: #0f766e;
    --teal-dark: #0b5a54;
    --line: #d5dedc;
    --user: #dff1ee;
  }

  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; padding: 24px; }
  .btn {
    font: inherit;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: 10px;
    border: 2px solid var(--teal);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .btn-primary { background: var(--teal); color: #fff; }
  .btn-primary:hover { background: var(--teal-dark); }
  .btn-secondary { background: transparent; color: var(--teal); }
  .btn-secondary:hover { background: var(--teal); color: #fff; }
  .btn:focus-visible, .chat button:focus-visible, .chat input:focus-visible {
    outline: 3px solid #f59e0b; outline-offset: 2px;
  }

  /* Chat bot panel */
  .chat {
    position: fixed; right: 20px; bottom: 20px;
    width: min(380px, calc(100vw - 40px));
    height: min(520px, calc(100vh - 40px));
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
    display: flex; flex-direction: column; overflow: hidden;
    transform: translateY(20px); opacity: 0; visibility: hidden;
    transition: transform .2s ease, opacity .2s ease, visibility .2s;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    z-index: 1000;
  }
  .chat.open { transform: none; opacity: 1; visibility: visible; }
  .chat header {
    background: var(--teal); color: #fff; padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .chat header strong { display: block; }
  .chat header small { opacity: .85; }
  .chat header button {
    background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; line-height: 1;
  }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 13px; border-radius: 12px; line-height: 1.4; font-size: 15px; }
  .msg.bot { background: #eef2f1; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: var(--user); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chat form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  .chat input {
    flex: 1; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  }
  .chat form button {
    font: inherit; font-weight: 600; background: var(--teal); color: #fff;
    border: 0; border-radius: 8px; padding: 0 16px; cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) { .chat { transition: none; } }
</style>

    <script src="script.js"></script>
    <!-- Chat bot logic: external file so it passes the CSP; defer waits for the page body -->
    <script src="chatbot.js" defer></script>

    </div>
    <h3>contact us at +91-9959968485</h3>

    <h3>mail us at msrpstores@gmail.com</h3>

    <div>
      <a
        href="https://support.gainsight.com/PX/Engagements/02_Test_Engagement_Configuration/05_Segments"

    <h3>Please fill the below form</h3>
    <form action="response.html">
      <!-- Text input -->
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" />
      <br /><br />

      <!-- Email input -->
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" />
      <br /><br />

      <!-- Password input -->
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" />
      <br /><br />

      <!-- Radio buttons -->
      <fieldset>
        <legend>Choose an option:</legend>
        <input type="radio" id="option1" name="options" value="option1" />
        <label for="option1">male</label>
        <br />
        <input type="radio" id="option2" name="options" value="option2" />
        <label for="option2">female</label>
      </fieldset>
      <br />

      <label for="dropdown">Select an city:</label>
      <select id="dropdown" name="dropdown" onchange="trackData()">
        <option value="" disabled selected>Select an option</option>
        <option value="Hyderabad">Hyderabad</option>
        <option value="Bangalore">Bangalore</option>
        <option value="Chennai">Chennai</option>
      </select>
      <br /><br />
      <!-- Checkboxes -->
      <fieldset>
        <legend>Select your interests:</legend>
        <input
          type="checkbox"
          id="interest1"
          name="interests"
          value="Javascript" />
        <label for="interest1">Javascript</label>
        <br />
        <input type="checkbox" id="interest2" name="interests" value="React" />
        <label for="interest2">React</label>
        <br />
        <input
          type="checkbox"
          id="interest3"
          name="interests"
          value="Angular" />
        <label for="interest3">Angular</label>
      </fieldset>
      <br />
      <!-- Submit button -->
      <button type="submit" id="btn-submit">submit</button>
    </form>
    <button id="check">Check</button>

    <!-- ===== THE TWO BUTTONS ===== -->
    <div class="actions">
      <button type="button" class="btn btn-primary" data-open-bot data-topic="Support">Get support</button>
      <button type="button" class="btn btn-secondary" data-open-bot data-topic="Sales">Talk to sales</button>
    </div>

    <!-- ===== THE BOT ===== -->
    <section class="chat" id="chat" role="dialog" aria-label="Chat bot" aria-hidden="true">
      <header>
        <div>
          <strong>Assistant</strong>
          <small id="chat-topic">How can I help?</small>
        </div>
        <button type="button" id="chat-close" aria-label="Close chat">&times;</button>
      </header>
      <div class="messages" id="messages" aria-live="polite"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Type your message" autocomplete="off" required />
        <button type="submit">Send</button>
      </form>
    </section>
  </body>
